<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="Chispa, el LED">
  <defs>
    <radialGradient id="cg-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE27A" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFE27A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cg-dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0A8"/>
      <stop offset=".55" stop-color="#FFD24A"/>
      <stop offset="1" stop-color="#E0A62E"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="92" r="88" fill="url(#cg-aura)"/>
  <!-- piernas: la larga es el + (ánodo), la corta es el − (cátodo) -->
  <path d="M82 150 V232" stroke="#9FB3C8" stroke-width="8" stroke-linecap="round"/>
  <path d="M118 150 V212" stroke="#9FB3C8" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="76" cy="238" rx="15" ry="8" fill="#17324D"/>
  <ellipse cx="124" cy="218" rx="15" ry="8" fill="#17324D"/>
  <!-- brazos -->
  <path d="M52 112 C38 104 30 88 26 70" stroke="#17324D" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="25" cy="66" r="9" fill="#FFD24A" stroke="#17324D" stroke-width="5"/>
  <path d="M148 112 C162 118 168 130 170 142" stroke="#17324D" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="171" cy="146" r="9" fill="#FFD24A" stroke="#17324D" stroke-width="5"/>
  <!-- cúpula del LED -->
  <path d="M52 134 V88 a48 48 0 0 1 96 0 V134 Z" fill="url(#cg-dome)" stroke="#17324D" stroke-width="6" stroke-linejoin="round"/>
  <path d="M66 70 a36 36 0 0 1 26 -22" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" opacity=".75"/>
  <rect x="42" y="130" width="116" height="22" rx="7" fill="#17324D"/>
  <rect x="146" y="130" width="12" height="22" rx="3" fill="#2B4A6B"/>
  <text x="62" y="147" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#E0A62E">+</text>
  <text x="132" y="147" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#E0A62E">−</text>
  <!-- cara -->
  <ellipse cx="82" cy="94" rx="8" ry="11" fill="#17324D"/>
  <ellipse cx="118" cy="94" rx="8" ry="11" fill="#17324D"/>
  <circle cx="85" cy="89" r="3" fill="#fff"/>
  <circle cx="121" cy="89" r="3" fill="#fff"/>
  <circle cx="68" cy="110" r="7" fill="#FF8A8A" opacity=".55"/>
  <circle cx="132" cy="110" r="7" fill="#FF8A8A" opacity=".55"/>
  <path d="M86 112 Q100 126 114 112" stroke="#17324D" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- chispa -->
  <path d="M150 18 l-12 22 h10 l-8 20 l20 -28 h-11 l9 -14 z" fill="#E0A62E" stroke="#17324D" stroke-width="3" stroke-linejoin="round"/>
</svg>
